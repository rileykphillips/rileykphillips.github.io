
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #333;
        }

        header {
            background-color: #173b70;
            color: white;
            text-align: center;
            padding: 35px;
        }

        nav {
            background-color: #10294f;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        nav a:hover {
            color: #ffd166;
        }

        main {
            text-align: center;
            padding: 50px 20px;
        }

        .card {
            background: white;
            max-width: 600px;
            margin: 20px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0002;
        }

        button {
            background-color: #173b70;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #28599b;
        }

        footer {
            background-color: #173b70;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>My first website hosted on GitHub Pages!</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <main id="home">
        <div class="card">
            <h2>Welcome!</h2>
            <p>This is my first website created using HTML and CSS.</p>
            <button onclick="showMessage()">Click Me</button>
            <p id="message"></p>
        </div>

        <div class="card" id="about">
            <h2>About Us</h2>
            <p>This website demonstrates how to create and publish a website using GitHub.</p>
        </div>

        <div class="card" id="contact">
            <h2>Contact</h2>
            <p>Email: example@email.com</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 My First Website</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Thanks for visiting my website!";
        }
    </script>

</body>
</html>
